# nginx HTTPS 配置（Phase0-7 TLS）
# 443: HTTPS 全路径代理到 uvicorn:8000（web UI + API）
# 80:  跳转到 HTTPS
# 8000: uvicorn 直连（设备通信保留）

# /etc/nginx/sites-enabled/xnow-https
server {
    listen 443 ssl http2;
    server_name 192.129.210.52;
    ssl_certificate /etc/nginx/ssl/xnow.crt;
    ssl_certificate_key /etc/nginx/ssl/xnow.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    client_max_body_size 100m;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# /etc/nginx/sites-enabled/xnow-http-redirect
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}
