# build-dylib.yml
# 在 macOS runner 上编译 xnower.dylib
# 触发条件: push 到 ios-plugin/ 目录 或 手动触发

name: Build XNOW Dylib

on:
  push:
    paths:
      - "ios-plugin/**"
      - ".github/workflows/build-dylib.yml"
    branches: [main]
  workflow_dispatch:
    inputs:
      server_url:
        description: "WebSocket server URL"
        required: false
        default: "ws://192.129.210.52:8000"
      inject_ipa_url:
        description: "URL to decrypted TikTok IPA (optional)"
        required: false
        default: ""

jobs:
  build:
    name: Build xnower.dylib
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 14 (use ld_classic for iOS 16 compat)
        run: |
          echo "=== Available Xcodes ==="
          ls -d /Applications/Xcode*.app 2>/dev/null | sort
          for xc in /Applications/Xcode_14.3.1.app /Applications/Xcode_14.2.app /Applications/Xcode_14.1.app /Applications/Xcode_14.0.app; do
            if [ -d "$xc" ]; then
              sudo xcode-select -s "$xc"
              echo "Selected: $xc"
              xcodebuild -version
              break
            fi
          done
          xcrun --sdk iphoneos --show-sdk-path

      - name: Compile .o files (no linking)
        run: |
          cd ios-plugin/xnow-dylib
          make objs 2>&1
        env:
          MIN_IOS: "14.0"

      - name: Build dylib (Xcode 14 classic ld for iOS 16 compat)
        run: |
          cd ios-plugin/xnow-dylib
          make dylib LDFLAGS="" 2>&1
          echo "=== Check format ==="
          otool -l build/xnower.dylib | grep -E "DYLD_CHAINED|EXPORTS_TRIE|DYLD_INFO|PRIVATE" | head -10 || true
          ls -la build/xnower.dylib

      - name: Convert private cmds + strip + re-sign
        run: |
          cd ios-plugin/xnow-dylib/build
          echo "=== Before ==="
          otool -l xnower.dylib | grep -E "CHAINED|EXPORTS_TRIE|DYLD_INFO|PRIVATE" | head -5 || true
          # Convert private cmds to standard
          python3 ../../scripts/convert-private-cmds.py xnower.dylib
          # Strip unnecessary data + ad-hoc re-sign
          strip -S -x xnower.dylib 2>/dev/null || true
          ldid -S -M xnower.dylib 2>/dev/null || true
          echo "=== After ==="
          otool -l xnower.dylib | grep -E "CHAINED|EXPORTS_TRIE|DYLD_INFO|PRIVATE" | head -5 || true

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: xnower-dylib
          path: |
            ios-plugin/xnow-dylib/build/xnower.dylib
            ios-plugin/xnow-dylib/build/Config.plist
          retention-days: 30

  inject-ipa:
    name: Inject IPA (optional)
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.inject_ipa_url != ''
    runs-on: macos-13
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dylib
        uses: actions/download-artifact@v4
        with:
          name: xnower-dylib
          path: ./build

      - name: Install tools
        run: |
          brew install ldid 2>/dev/null || true

      - name: Download IPA
        run: |
          IPA_URL="${{ github.event.inputs.inject_ipa_url }}"
          curl -L -o TikTok.ipa "$IPA_URL"
          ls -lh TikTok.ipa

      - name: Inject dylib into IPA
        run: |
          chmod +x ios-plugin/scripts/inject-ipa.sh
          bash ios-plugin/scripts/inject-ipa.sh \
            ./TikTok.ipa \
            ./build/xnower.dylib \
            ./TikTok_XNOW.ipa

      - name: Upload injected IPA
        uses: actions/upload-artifact@v4
        with:
          name: TikTok_XNOW.ipa
          path: ./TikTok_XNOW.ipa
          retention-days: 7
