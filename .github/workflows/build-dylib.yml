# build-dylib.yml
# 在 macOS runner 上编译 xnower.dylib
# 触发条件: push 到 ios-plugin/ 目录 或 手动触发

name: Build XNOW Dylib

on:
  push:
    paths:
      - "ios-plugin/**"
      - ".github/workflows/build-dylib.yml"
    branches: [main]
  workflow_dispatch:
    inputs:
      server_url:
        description: "WebSocket server URL"
        required: false
        default: "ws://192.129.210.52:8000"
      inject_ipa_url:
        description: "URL to decrypted TikTok IPA (optional)"
        required: false
        default: ""

jobs:
  build:
    name: Build xnower.dylib
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select oldest Xcode (need ld_classic for iOS 16 compat)
        run: |
          echo "=== Available Xcodes ==="
          ls -d /Applications/Xcode*.app 2>/dev/null | sort
          for xc in /Applications/Xcode_15.0.app /Applications/Xcode_15.0.1.app /Applications/Xcode_14.3.1.app /Applications/Xcode_14.2.app; do
            if [ -d "$xc" ]; then
              sudo xcode-select -s "$xc"
              echo "Selected: $xc"
              xcodebuild -version
              break
            fi
          done
          # Check if ld_classic exists
          xcrun --find ld_classic 2>/dev/null && echo "ld_classic FOUND" || echo "ld_classic NOT found"
          xcrun --sdk iphoneos --show-sdk-path

      - name: Compile .o files (no linking)
        run: |
          cd ios-plugin/xnow-dylib
          make objs 2>&1
        env:
          MIN_IOS: "14.0"

      - name: Build dylib (try ld_classic first for iOS 16 compat)
        run: |
          cd ios-plugin/xnow-dylib
          # Try ld_classic linker if available (no chained fixups ever)
          if xcrun --find ld_classic 2>/dev/null; then
            echo "=== Using ld_classic ==="
            make dylib LDFLAGS="-Xlinker -ld_classic" 2>&1
          else
            echo "=== Using default ld with -no_fixup_chains ==="
            make dylib LDFLAGS="-Wl,-no_fixup_chains" 2>&1
          fi
          echo "=== Check format ==="
          otool -l build/xnower.dylib | grep -E "DYLD_CHAINED|EXPORTS_TRIE|DYLD_INFO|PRIVATE|CHAINED" | head -10 || true
          ls -la build/xnower.dylib

      - name: Convert private cmds + strip (NO codesign — 避免 LC_CODE_SIGNATURE 阻塞重签名)
        run: |
          cd ios-plugin/xnow-dylib/build
          echo "=== Before ==="
          otool -l xnower.dylib | grep -E "CHAINED|EXPORTS_TRIE|DYLD_INFO|PRIVATE|SIGNATURE" | head -5 || true
          # Convert private cmds to standard
          python3 ../../scripts/convert-private-cmds.py xnower.dylib
          # Strip unnecessary symbols
          strip -S -x xnower.dylib 2>/dev/null || true
          echo "=== After (verify no CODE_SIGNATURE) ==="
          otool -l xnower.dylib | grep -E "SIGNATURE|CODE" | head -5 || echo "✅ 无 LC_CODE_SIGNATURE"

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: xnower-dylib
          path: |
            ios-plugin/xnow-dylib/build/xnower.dylib
            ios-plugin/xnow-dylib/build/Config.plist
          retention-days: 30

  inject-ipa:
    name: Inject IPA (optional)
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.inject_ipa_url != ''
    runs-on: macos-13
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dylib
        uses: actions/download-artifact@v4
        with:
          name: xnower-dylib
          path: ./build

      - name: Install tools
        run: |
          brew install ldid 2>/dev/null || true

      - name: Download IPA
        run: |
          IPA_URL="${{ github.event.inputs.inject_ipa_url }}"
          curl -L -o TikTok.ipa "$IPA_URL"
          ls -lh TikTok.ipa

      - name: Inject dylib into IPA (build-xnow-ipa.py)
        run: |
          python3 build-xnow-ipa.py \
            ./TikTok.ipa \
            ./build/xnower.dylib \
            -o ./TikTok_XNOW.ipa

      - name: Upload injected IPA
        uses: actions/upload-artifact@v4
        with:
          name: TikTok_XNOW.ipa
          path: ./TikTok_XNOW.ipa
          retention-days: 7
