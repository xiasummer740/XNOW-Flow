<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XNOW 手机控制台</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,'Microsoft YaHei',sans-serif; background:#0f1115; color:#e8eaed; padding:20px; }
h1 { font-size:20px; margin-bottom:16px; }
h2 { font-size:15px; margin:20px 0 10px; color:#9aa0a6; }
.card { background:#1c1f26; border-radius:10px; padding:16px; margin-bottom:16px; }
label { display:block; margin-bottom:6px; color:#9aa0a6; font-size:13px; }
select, input[type=text] { width:100%; padding:10px; background:#2a2e37; border:1px solid #3c4048; border-radius:6px; color:#e8eaed; font-size:14px; margin-bottom:12px; }
.btns { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px; }
button { padding:12px 8px; border:none; border-radius:6px; font-size:14px; cursor:pointer; background:#3b4252; color:#e8eaed; transition:background .15s; }
button:hover { background:#4b5263; }
button:disabled { opacity:.4; cursor:not-allowed; }
.btn-primary { background:#1a73e8; } .btn-primary:hover { background:#1765cc; }
.btn-danger { background:#d93025; } .btn-danger:hover { background:#bb2e24; }
#result { background:#0d1117; border:1px solid #2a2e37; border-radius:6px; padding:12px; font-size:13px; color:#8ab4f8; max-height:200px; overflow-y:auto; white-space:pre-wrap; }
.status { color:#7d8590; font-size:13px; margin-top:8px; }
.online { color:#4caf50; } .offline { color:#f44336; }
</style>
</head>
<body>
<h1>📱 XNOW 手机控制台</h1>

<div class="card">
  <label>选择设备（机器码）</label>
  <select id="deviceSelect"><option value="">加载中...</option></select>
  <div class="status" id="deviceStatus"></div>
</div>

<div class="card">
  <h2>🎮 基本操作</h2>
  <div class="btns">
    <button class="btn-primary" onclick="cmd('scroll_down')">⬇️ 下滑</button>
    <button class="btn-primary" onclick="cmd('scroll_up')">⬆️ 上滑</button>
    <button onclick="cmd('like')">❤️ 点赞</button>
    <button onclick="cmd('follow')">➕ 关注</button>
    <button onclick="cmd('comment',{text:'赞！'})">💬 评论</button>
    <button onclick="cmd('collect')">⭐ 收藏</button>
    <button onclick="cmd('screenshot')">📸 截图</button>
    <button onclick="cmd('smart_browse',{min_scrolls:5,max_scrolls:12})">🌐 智能浏览</button>
    <button onclick="cmd('go_back')">↩️ 返回</button>
    <button onclick="cmd('go_home')">🏠 首页</button>
    <button onclick="cmd('open_tab',{tab:'discover'})">🔍 发现页</button>
    <button onclick="cmd('open_tab',{tab:'inbox'})">✉️ 消息页</button>
    <button onclick="cmd('open_tab',{tab:'profile'})">👤 我的页</button>
    <button onclick="cmd('open_search')">🔎 打开搜索</button>
    <button onclick="cmd('refresh')">🔄 下拉刷新</button>
    <button onclick="cmd('share')">📤 分享</button>
    <button onclick="cmd('save_video')">💾 保存视频</button>
  </div>
</div>

<div class="card">
  <h2>✏️ 修改资料</h2>
  <label>新昵称</label>
  <input type="text" id="newNickname" placeholder="如: 某某品牌">
  <label>新签名</label>
  <input type="text" id="newSignature" placeholder="如: 欢迎关注">
  <button onclick="cmd('edit_profile',{nickname:document.getElementById('newNickname').value,signature:document.getElementById('newSignature').value})">✏️ 修改资料</button>
</div>

<div class="card">
  <h2>🎬 自动发视频</h2>
  <label>视频 URL（素材/上传后的链接）</label>
  <input type="text" id="videoUrl" placeholder="如 https://.../uploads/xxx.mp4">
  <label>标题 / 文案</label>
  <input type="text" id="videoTitle" placeholder="如 这个视频太赞了">
  <div class="btns">
    <button class="btn-primary" onclick="createVideoPost()">📝 创建视频发布任务</button>
    <button class="btn-primary" onclick="dispatchLatestVideoPost()">🚀 立即发布</button>
  </div>
</div>

<div class="card">
  <h2>💬 自动私信</h2>
  <label>目标用户名（可空，空则进消息页）</label>
  <input type="text" id="dmTarget" placeholder="如 1234567890">
  <label>私信内容 / 话术</label>
  <input type="text" id="dmContent" placeholder="如 你好，合作了解一下">
  <div class="btns">
    <button class="btn-primary" onclick="createDmTask()">📝 创建私信任务</button>
    <button class="btn-primary" onclick="dispatchLatestDm()">🚀 立即发送</button>
  </div>
</div>

<div class="card">
  <h2>📝 注册账号</h2>
  <label>邮箱（优先）</label>
  <input type="text" id="regEmail" placeholder="如 newuser@example.com">
  <label>手机号（邮箱为空时用）</label>
  <input type="text" id="regPhone" placeholder="如 +8613800000000">
  <label>密码（可空）</label>
  <input type="text" id="regPassword" placeholder="如 Xnow@123456">
  <button class="btn-primary" onclick="registerAccount()">📝 注册账号</button>
  <div class="status">⚠️ 纯 UI 自动化 best-effort；滑块/验证码需人工或专用打码工具</div>
</div>

<div class="card">
  <h2>🌱 养号计划</h2>
  <label>计划名称</label>
  <input type="text" id="nurtureName" placeholder="如 新号养号计划">
  <label>每次滑动次数（min ~ max）</label>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
    <input type="number" id="nurtureMinScrolls" value="2" min="1" max="20">
    <input type="number" id="nurtureMaxScrolls" value="5" min="1" max="20">
  </div>
  <label>点赞概率（0~1）</label>
  <input type="number" id="nurtureLikeProb" value="0.2" step="0.05" min="0" max="1">
  <label>关注概率（0~1）</label>
  <input type="number" id="nurtureFollowProb" value="0.05" step="0.05" min="0" max="1">
  <label>浏览时长（分钟）</label>
  <input type="number" id="nurtureBrowseMinutes" value="2" min="1" max="10">
  <div class="btns">
    <button class="btn-primary" onclick="createNurturePlan()">📝 创建养号计划</button>
    <button class="btn-primary" onclick="startNurturePlan()">▶️ 开始养号</button>
    <button class="btn-danger" onclick="pauseNurturePlan()">⏸ 暂停养号</button>
  </div>
  <div class="status" id="nurtureStatus">创建后点「开始养号」立即下发 nurture_tick，后台每 30 分钟自动 tick</div>
</div>

<div class="card">
  <h2>🚀 快捷指令</h2>
  <label>指令名称</label>
  <input type="text" id="qcName" placeholder="如 批量点赞10个">
  <label>Action</label>
  <input type="text" id="qcAction" placeholder="如 batch_like">
  <label>Params（JSON，可空）</label>
  <input type="text" id="qcParams" placeholder='如 {"count":10,"interval":1}'>
  <label>描述（可空）</label>
  <input type="text" id="qcDesc" placeholder="如 快速给10个视频点赞">
  <div class="btns">
    <button class="btn-primary" onclick="saveQuickCommand()">💾 保存快捷指令</button>
    <button class="btn-primary" onclick="dispatchLatestQuickCommand()">🚀 下发给当前设备</button>
  </div>
  <div class="status" id="qcStatus">保存后即可一键下发给当前选中设备</div>
</div>

<div class="card">
  <h2>🔗 打开指定内容</h2>
  <label>搜索关键词</label>
  <input type="text" id="kw" placeholder="如 美食 或 用户名">
  <button onclick="cmd('search_keyword',{keyword:document.getElementById('kw').value})">搜索关键词</button>
  <label>用户 UID / unique_id</label>
  <input type="text" id="uid" placeholder="如 1234567890">
  <button onclick="cmd('open_user',{uid:document.getElementById('uid').value})">打开用户主页</button>
  <label>视频 aweme_id</label>
  <input type="text" id="avid" placeholder="如 7123456789012345678">
  <button onclick="cmd('open_video',{aweme_id:document.getElementById('avid').value})">打开视频</button>
</div>

<div class="card">
  <h2>📊 采集</h2>
  <div class="btns">
    <button onclick="cmd('collect_fans',{count:20})">👥 采集粉丝</button>
    <button onclick="cmd('collect_videos',{count:10})">🎬 采集视频</button>
    <button onclick="cmd('collect_comments',{count:20})">💬 采集评论用户</button>
    <button onclick="cmd('collect_live_users',{count:20})">📺 采集直播间用户</button>
    <button onclick="cmd('get_account_info')">👤 获取账号信息</button>
    <button onclick="cmd('check_health')">💓 健康检查</button>
  </div>
</div>

<div class="card">
  <h2>🔍 数据筛选</h2>
  <label>性别</label>
  <select id="filterGender">
    <option value="">全部</option>
    <option value="male">男</option>
    <option value="female">女</option>
    <option value="unknown">未知</option>
  </select>
  <label>地区</label>
  <input type="text" id="filterRegion" placeholder="如 广东 / US">
  <label>分组</label>
  <input type="text" id="filterGroup" placeholder="如 未分组">
  <div class="btns">
    <button class="btn-primary" onclick="viewCollectedData()">📋 查看采集数据</button>
  </div>
</div>

<div class="card">
  <h2>🔄 批量操作</h2>
  <div class="btns">
    <button onclick="cmd('batch_like',{count:10,interval:1})">批量点赞(10)</button>
    <button onclick="cmd('batch_follow',{count:5,interval:1})">批量关注(5)</button>
    <button onclick="cmd('batch_comment',{count:5,interval:2,text:'不错'})">批量评论</button>
  </div>
</div>

<div class="card">
  <h2>👤 账号操作</h2>
  <div class="btns">
    <button onclick="cmd('switch_account',{aweme_id:''})">🔄 切换账号</button>
    <button onclick="cmd('logout')">🚪 退出登录</button>
    <button onclick="cmd('report_account')">📮 上报账号</button>
  </div>
</div>

<div class="card">
  <h2>🆔 UDID 签名管理</h2>
  <button onclick="loadUdidRequests()">刷新 UDID 申请</button>
  <div id="udidList" style="margin-top:10px;font-size:12px;"></div>
</div>

<div class="card">
  <h2>⚙️ 参数指令（自定义 JSON）</h2>
  <label>Action</label>
  <input type="text" id="customAction" placeholder="如 switch_account">
  <label>Params（JSON）</label>
  <input type="text" id="customParams" placeholder='如 {"aweme_id":"123456"}'>
  <button class="btn-danger" onclick="cmdCustom()">发送自定义指令</button>
</div>

<div class="card">
  <h2>📋 执行结果</h2>
  <div id="result">等待操作...</div>
</div>

<script>
const API = '';  // 相对路径（同源）
let token = localStorage.getItem('xn_token') || '';
let deviceId = null;
let pollTimer = null;
let lastNurturePlanId = null;
let lastQuickCommandId = null;

// 登录（提示输入密码）
async function ensureLogin() {
  if (token) return true;
  const pw = prompt('XNOW 控制台登录\n用户名: admin\n请输入密码:');
  if (pw === null) return false;
  const resp = await fetch(API + '/api/auth/login/', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({username:'admin', password:pw})
  });
  if (resp.ok) {
    const d = await resp.json();
    token = d.access || d.token || '';
    if (token) { localStorage.setItem('xn_token', token); return true; }
  }
  log('❌ 登录失败，请检查 admin 密码');
  return false;
}

async function api(path, opts={}) {
  const headers = {'Content-Type':'application/json'};
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const resp = await fetch(API + path, {...opts, headers});
  if (resp.status === 401) {
    // M15: 清 token + 停止轮询 + 重新登录
    localStorage.removeItem('xn_token');
    token = '';
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    log('⚠️ 登录已失效，请重新登录');
    await ensureLogin().then(ok => { if (ok) location.reload(); });
    throw new Error('unauthorized');
  }
  return resp.json();
}

async function loadDevices() {
  try {
    const d = await api('/api/biz/v2/device-bindings/?limit=100');
    const sel = document.getElementById('deviceSelect');
    sel.innerHTML = '';
    (d.results||[]).forEach(dev => {
      const opt = document.createElement('option');
      opt.value = dev.id;  // 用数字 ID（batch_dispatch 需要 int）
      opt.dataset.name = dev.name;
      opt.textContent = (dev.device_id || dev.name) + (dev.is_online ? ' ●在线' : ' ○离线');
      sel.appendChild(opt);
    });
    deviceId = sel.value || null;
    updateStatus();
    // 自动轮询设备在线状态
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(() => {
      api('/api/biz/v2/device-bindings/?limit=100').then(d => {
        const sel = document.getElementById('deviceSelect');
        const opt = sel.options[sel.selectedIndex];
        const dev = (d.results||[]).find(x => x.id == deviceId);
        if (dev) {
          // 安全渲染：用 textContent 防 XSS（设备数据不可信）
          const el = document.getElementById('deviceStatus');
          el.textContent = '';
          const span = document.createElement('span');
          span.className = dev.is_online ? 'online' : 'offline';
          span.textContent = dev.is_online ? '● 在线' : '○ 离线';
          el.appendChild(span);
          el.appendChild(document.createTextNode(' 设备:' + (dev.device_id || dev.name) + ' App:' + (dev.app_version || '—')));
        }
      }).catch(()=>{});
    }, 5000);
  } catch(e) { log('加载设备失败: ' + e.message); }
}

function updateStatus() {
  const sel = document.getElementById('deviceSelect');
  const opt = sel.options[sel.selectedIndex];
  const name = opt ? (opt.dataset.name || opt.value) : '';
  document.getElementById('deviceStatus').textContent = deviceId ? '当前设备ID: ' + deviceId + ' (' + name + ')' : '请选择设备';
}

function selectedDevice() { return document.getElementById('deviceSelect').value; }

async function cmd(action, params={}) {
  const dev = selectedDevice();
  if (!dev) { log('⚠️ 请先选择设备'); return; }
  log(`⏳ 发送指令: ${action} → 设备#${dev}`);
  try {
    const r = await api('/api/biz/v2/device-bindings/batch/dispatch/', {
      method:'POST',
      body: JSON.stringify({device_ids:[parseInt(dev)], action, params})
    });
    log('✅ ' + (r.message || JSON.stringify(r)));
  } catch(e) { log('❌ ' + e.message); }
}

async function cmdCustom() {
  const action = document.getElementById('customAction').value.trim();
  if (!action) { log('⚠️ 请输入 Action'); return; }
  let params = {};
  try { params = JSON.parse(document.getElementById('customParams').value || '{}'); }
  catch(e) { log('❌ Params 不是合法 JSON'); return; }
  await cmd(action, params);
}

async function viewCollectedData() {
  const gender = document.getElementById('filterGender').value;
  const region = document.getElementById('filterRegion').value.trim();
  const group = document.getElementById('filterGroup').value.trim();
  const params = new URLSearchParams();
  params.set('limit', '50');
  if (gender) params.set('gender', gender);
  if (region) params.set('region', region);
  if (group) params.set('group_name', group);
  try {
    const d = await api('/api/biz/v2/collected-data/?' + params.toString());
    const rows = (d.results || []);
    if (!rows.length) { log('📋 没有匹配的采集数据'); return; }
    let out = `📋 采集数据 (共 ${d.count} 条):\n`;
    rows.forEach(r => {
      out += `• ${r.author || r.content || '#' + r.id} [${r.gender || '未知'}/${r.region || '未知'}] 粉丝:${r.followers || 0} 组:${r.group_name || '未分组'} (${r.source_type || ''})\n`;
    });
    log(out);
  } catch(e) { log('❌ 查看采集数据失败: ' + e.message); }
}

function selectedDeviceCode() {
  const sel = document.getElementById('deviceSelect');
  const opt = sel.options[sel.selectedIndex];
  return opt ? (opt.dataset.name || '') : '';
}

async function createVideoPost() {
  const devCode = selectedDeviceCode();
  if (!devCode) { log('⚠️ 请先选择设备'); return; }
  const url = document.getElementById('videoUrl').value.trim();
  const title = document.getElementById('videoTitle').value.trim();
  if (!url && !title) { log('⚠️ 视频URL 和标题至少填一个'); return; }
  log(`⏳ 创建视频发布任务: 设备=${devCode} 标题=${title || '(空)'}`);
  try {
    const r = await api('/api/biz/v2/video-posts/', {
      method:'POST',
      body: JSON.stringify({device_id: devCode, video_url: url, title})
    });
    log('✅ 已创建任务 #' + r.id + '（状态 ' + r.status + '），可点「立即发布」下发');
  } catch(e) { log('❌ 创建失败: ' + e.message); }
}

async function dispatchLatestVideoPost() {
  const devCode = selectedDeviceCode();
  if (!devCode) { log('⚠️ 请先选择设备'); return; }
  try {
    const d = await api('/api/biz/v2/video-posts/?device_id=' + encodeURIComponent(devCode) + '&status=pending&limit=5');
    const rows = d.results || [];
    if (!rows.length) { log('📋 该设备暂无视频发布任务，请先「创建视频发布任务」'); return; }
    const post = rows[0];
    log(`⏳ 下发发视频指令: 任务#${post.id} → ${post.device_id}`);
    const r = await api('/api/biz/v2/video-posts/' + post.id + '/dispatch/', {method:'POST', body:'{}'});
    log('✅ ' + (r.message || JSON.stringify(r)));
  } catch(e) { log('❌ 下发失败: ' + e.message); }
}

async function createDmTask() {
  const devCode = selectedDeviceCode();
  if (!devCode) { log('⚠️ 请先选择设备'); return; }
  const target = document.getElementById('dmTarget').value.trim();
  const content = document.getElementById('dmContent').value.trim();
  if (!content) { log('⚠️ 私信内容不能为空'); return; }
  log(`⏳ 创建私信任务: 设备=${devCode} 目标=${target || '(消息页)'}`);
  try {
    const r = await api('/api/biz/v2/dm-tasks/', {
      method:'POST',
      body: JSON.stringify({device_id: devCode, target_username: target, content})
    });
    log('✅ 已创建私信任务 #' + r.id + '（状态 ' + r.status + '），可点「立即发送」下发');
  } catch(e) { log('❌ 创建失败: ' + e.message); }
}

async function dispatchLatestDm() {
  const devCode = selectedDeviceCode();
  if (!devCode) { log('⚠️ 请先选择设备'); return; }
  try {
    const d = await api('/api/biz/v2/dm-tasks/?device_id=' + encodeURIComponent(devCode) + '&status=pending&limit=5');
    const rows = d.results || [];
    if (!rows.length) { log('📋 该设备暂无待发私信任务，请先「创建私信任务」'); return; }
    const task = rows[0];
    log(`⏳ 下发私信指令: 任务#${task.id} → ${task.device_id}`);
    const r = await api('/api/biz/v2/dm-tasks/' + task.id + '/dispatch/', {method:'POST', body:'{}'});
    log('✅ ' + (r.message || JSON.stringify(r)));
  } catch(e) { log('❌ 下发失败: ' + e.message); }
}

// ========== 养号计划 / 快捷指令 / 注册账号 ==========

async function createNurturePlan() {
  const devCode = selectedDeviceCode();
  if (!devCode) { log('⚠️ 请先选择设备'); return; }
  const name = document.getElementById('nurtureName').value.trim() || ('养号计划-' + Date.now());
  const minScrolls = parseInt(document.getElementById('nurtureMinScrolls').value) || 2;
  const maxScrolls = parseInt(document.getElementById('nurtureMaxScrolls').value) || 5;
  const likeProb = parseFloat(document.getElementById('nurtureLikeProb').value);
  const followProb = parseFloat(document.getElementById('nurtureFollowProb').value);
  const browseMinutes = parseInt(document.getElementById('nurtureBrowseMinutes').value) || 2;
  log(`⏳ 创建养号计划: ${name} → 设备=${devCode}`);
  try {
    const r = await api('/api/biz/v2/nurture-plans/', {
      method:'POST',
      body: JSON.stringify({
        name,
        device_ids:[devCode],
        account_ids:[],
        daily_actions:{
          min_scrolls: minScrolls,
          max_scrolls: maxScrolls,
          like_probability: likeProb || 0.2,
          follow_probability: followProb || 0.05,
          comment_probability: 0.02,
          browse_minutes: browseMinutes
        }
      })
    });
    lastNurturePlanId = r.id;
    document.getElementById('nurtureStatus').textContent = '已创建计划 #' + r.id + '（状态 ' + r.status + '），可点「开始养号」';
    log('✅ 已创建养号计划 #' + r.id + '，可点「开始养号」');
  } catch(e) { log('❌ 创建失败: ' + e.message); }
}

async function _latestNurturePlanId() {
  const devCode = selectedDeviceCode();
  try {
    // M13: 查选中设备的养号计划（不取全局最新）
    const url = devCode
      ? '/api/biz/v2/nurture-plans/?limit=50'
      : '/api/biz/v2/nurture-plans/?limit=1';
    const d = await api(url);
    const rows = (d.results || []).filter(p => !devCode || (p.device_ids || []).includes(devCode));
    if (rows.length) { lastNurturePlanId = rows[0].id; return lastNurturePlanId; }
  } catch(e) {}
  return null;
}

async function startNurturePlan() {
  const pid = await _latestNurturePlanId();
  if (!pid) { log('⚠️ 还没有养号计划，请先「创建养号计划」'); return; }
  log(`⏳ 开始养号: 计划#${pid}`);
  try {
    const r = await api('/api/biz/v2/nurture-plans/' + pid + '/start/', {method:'POST', body:'{}'});
    log('✅ ' + (r.message || JSON.stringify(r)));
  } catch(e) { log('❌ 开始失败: ' + e.message); }
}

async function pauseNurturePlan() {
  const pid = await _latestNurturePlanId();
  if (!pid) { log('⚠️ 还没有养号计划，请先「创建养号计划」'); return; }
  log(`⏳ 暂停养号: 计划#${pid}`);
  try {
    const r = await api('/api/biz/v2/nurture-plans/' + pid + '/pause/', {method:'POST', body:'{}'});
    log('✅ ' + (r.message || JSON.stringify(r)));
  } catch(e) { log('❌ 暂停失败: ' + e.message); }
}

async function saveQuickCommand() {
  const name = document.getElementById('qcName').value.trim();
  const action = document.getElementById('qcAction').value.trim();
  if (!action) { log('⚠️ 请输入 Action'); return; }
  let params = {};
  try { params = JSON.parse(document.getElementById('qcParams').value || '{}'); }
  catch(e) { log('❌ Params 不是合法 JSON'); return; }
  log(`⏳ 保存快捷指令: ${name || action}`);
  try {
    const r = await api('/api/biz/v2/quick-commands/', {
      method:'POST',
      body: JSON.stringify({
        name: name || action,
        action,
        params,
        description: document.getElementById('qcDesc').value.trim()
      })
    });
    lastQuickCommandId = r.id;
    document.getElementById('qcStatus').textContent = '已保存指令 #' + r.id + '：' + action;
    log('✅ 已保存快捷指令 #' + r.id);
  } catch(e) { log('❌ 保存失败: ' + e.message); }
}

async function dispatchLatestQuickCommand() {
  const devCode = selectedDeviceCode();
  if (!devCode) { log('⚠️ 请先选择设备'); return; }
  if (!lastQuickCommandId) {
    try {
      const d = await api('/api/biz/v2/quick-commands/?limit=1');
      if (d.results && d.results.length) lastQuickCommandId = d.results[0].id;
    } catch(e) {}
  }
  if (!lastQuickCommandId) { log('⚠️ 还没有快捷指令，请先「保存快捷指令」'); return; }
  log(`⏳ 下发快捷指令 #${lastQuickCommandId} → ${devCode}`);
  try {
    const r = await api('/api/biz/v2/quick-commands/' + lastQuickCommandId + '/dispatch/', {
      method:'POST',
      body: JSON.stringify({device_id: devCode})
    });
    log('✅ ' + (r.message || JSON.stringify(r)));
  } catch(e) { log('❌ 下发失败: ' + e.message); }
}

async function registerAccount() {
  const email = document.getElementById('regEmail').value.trim();
  const phone = document.getElementById('regPhone').value.trim();
  const password = document.getElementById('regPassword').value.trim();
  if (!email && !phone) { log('⚠️ 邮箱和手机号至少填一个'); return; }
  await cmd('register_account', {email, phone, password});
}

function log(msg) {
  const el = document.getElementById('result');
  el.textContent = new Date().toLocaleTimeString() + ' ' + msg + '\n' + el.textContent;
  if (el.textContent.length > 3000) el.textContent = el.textContent.slice(0, 3000);
}

document.getElementById('deviceSelect').addEventListener('change', () => {
  deviceId = selectedDevice();
  updateStatus();
});

// ========== UDID 签名管理 ==========
async function loadUdidRequests() {
  try {
    const d = await api('/api/biz/v2/udid/admin/?limit=50');
    const el = document.getElementById('udidList');
    if (!d.results || !d.results.length) { el.textContent = '暂无申请'; return; }
    el.innerHTML = '';
    d.results.forEach(r => {
      const row = document.createElement('div');
      row.style.cssText = 'margin-bottom:8px;padding:8px;background:#2a2e37;border-radius:6px;';
      const info = document.createElement('div');
      info.textContent = `${r.device_name||'设备'} | ${r.udid} | ${r.status} | ${r.created_at||''}`;
      row.appendChild(info);
      if (r.status === 'pending') {
        const input = document.createElement('input');
        input.placeholder = '签名后 IPA 下载链接';
        input.style.cssText = 'width:100%;margin-top:6px;padding:6px;';
        row.appendChild(input);
        const btn = document.createElement('button');
        btn.textContent = '✅ 标记已签名';
        btn.onclick = async () => {
          await api('/api/biz/v2/udid/admin/' + r.id + '/sign/', {method:'POST', body: JSON.stringify({ipa_url: input.value})});
          loadUdidRequests();
        };
        row.appendChild(btn);
      } else if (r.status === 'signed' && r.ipa_url) {
        const a = document.createElement('div');
        a.textContent = '📲 ' + r.ipa_url;
        a.style.cssText = 'color:#8ab4f8;font-size:11px;margin-top:4px;word-break:break-all;';
        row.appendChild(a);
      }
      el.appendChild(row);
    });
  } catch(e) { log('UDID加载失败: ' + e.message); }
}

ensureLogin().then(ok => {
  if (ok) { loadDevices(); loadUdidRequests(); }
  else log('❌ 登录失败，请检查 admin 密码');
});
